<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STUDENTS COLLEGE REGISTRATION</title>
</head>

<body>

    <header>
        <h1>COLCOMP Student Registration Form</h1>
        <p>Please fill in your details below.</p>
    </header>

    <main>
        <section>
            <h2>Student Information</h2>

            <form action="#" method="post">

                <!--Name-->
                <label for="name">Full Name</label>
                <input type="text" id="name" name="name" placeholder="Enter your full name" required>

                <br>

                <!--Matric number-->
                <label for="matric">Matric Number</label>
                <input type="text" id="matric" name="matric number" placeholder="Enter your matric number" required>

                <!--Department-->
                <label for="department">Department:</label>
                <select name="department" id="department" required>

                    <option value="">Select Department</option>
                    <option value="computer-science">Computer Science</option>
                    <option value="ICT">Information and communication Technology</option>
                    <option value="IFT">Information Technology</option>
                    <option value="cyber-security">Cyber Security</option>
                    <option value="data-science">Data Science</option>
                    <option value="information-system">Information System</option>
                    <option value="software-engineering">Software Engineering</option>

                </select>
                <br>

                <!--Email-->
                <label for="email">Email Address:</label>
                <input type="email" id="email" name="email" placeholder="example@email.com" required>
                <br>

                <!--phone number-->
                <label for="phone">Phone Number</label>
                <input type="tel" id="phone" name="phone" placeholder="e.g. 08012345678" required>
                <br>

                <!--Gender-->
                <fieldset>
                    <legend>Gender</legend>

                    <input type="radio" id="male" name="gender" value="male" required>
                    <label for="male">Male</label>

                    <input type="radio" id="female" name="gender" value="female">
                    <label for="female">Female</label>
                </fieldset>
                <br>

                <!--programme-->
                <label for="programme">Programme:</label>
                <select name="programme" id="programme" required>
                    <option value="">Select Programme</option>
                    <option value="fulltime-weekdays">Full-time(Weekdays)</option>
                    <option value="weekends">Weekend Programme</option>
                </select>
                <br>

                <!--Submit Button-->
                <button type="submit">
                    Submit Registration
                </button>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 COLCOMP Student Registration</p>
    </footer>

</body>

</html>
